spring:
  application:
    name: finance-tracker-api

  datasource:
    # Neon connection string, e.g.
    # jdbc:postgresql://ep-xxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Neon's pooled endpoint does the real pooling; keep this side small.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema. Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

app:
  jwt:
    # MUST be overridden in every environment. At least 32 characters.
    secret: ${APP_JWT_SECRET:change-me-to-a-long-random-value-at-least-32-chars}
    issuer: where-did-my-money-go
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cookie:
    name: wdmmg_refresh
    path: /
    secure: ${COOKIE_SECURE:false}   # true everywhere except local http
    same-site: Lax
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  rate-limit:
    login-attempts: 5
    login-window: 15m
    writes-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.tahir.finance: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
