spring:
  application:
    name: expense-manager
  # Lets you keep secrets in backend/.env (KEY=value lines). Real env vars win.
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Neon example: jdbc:postgresql://ep-xxx-123456.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-to-a-long-random-string-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Used to decide what "today" is for recurring expenses.
  zone: ${APP_TIMEZONE:Asia/Kolkata}
  admin:
    email: ${ADMIN_EMAIL:admin@expense.app}
    password: ${ADMIN_PASSWORD:Admin@12345}
    name: ${ADMIN_NAME:Administrator}
